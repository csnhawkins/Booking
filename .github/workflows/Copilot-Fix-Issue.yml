# ===========================
# Workflow: Copilot-Fix-Issue.yml
# Description: Adding the 'copilot-fix' label to an issue hands it to the Copilot CLI agent running on the
#              self-hosted runner. Copilot edits the schema-model and drives the Flyway MCP to generate and
#              validate the migration, then scripts/Invoke-CopilotFix.ps1 opens a PR for human approval.
# ===========================
#
# Secrets required (repository secrets):
#   COPILOT_FIX_GH_TOKEN  - PAT used by git and gh: contents (write), pull requests (write), issues (write).
#                           A PAT is used instead of the default token so the PR it opens triggers the PR check workflow.
#   COPILOT_GITHUB_TOKEN  - PAT with the 'Copilot Requests' permission, used by the Copilot CLI.
#
# Note: for 'issues' events GitHub always runs the copy of this file on the DEFAULT branch. While testing on a
# feature branch, use 'Run workflow' (workflow_dispatch) and pass the branch name as base_branch.

name: Copilot Fix Issue

on:
  issues:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
      base_branch:
        description: 'Branch to start from and open the PR against'
        required: true
        default: 'main'

permissions:
  contents: read # The PAT does the writing; the default token only needs to read

concurrency: # Only one Copilot run at a time - they share the shadow database
  group: copilot-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Copilot fixes the issue
    runs-on: [ self-hosted, local ] # The HAWKINS-LAPTOP runner, which has the Copilot CLI and Flyway MCP installed
    environment: 'build' # Gives this job the database login secrets (TARGET_DATABASE_USERNAME / PASSWORD) used by the Flyway MCP
    # Guard: a manual run, or the 'copilot-fix' label applied by the repository owner. The agent can run commands on this
    # machine, so nobody else should be able to start it by labelling an issue.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'copilot-fix' && github.actor == github.repository_owner)
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      BASE_BRANCH: ${{ inputs.base_branch || github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.COPILOT_FIX_GH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      DB_USER: ${{ secrets.TARGET_DATABASE_USERNAME }}
      DB_PASSWORD: ${{ secrets.TARGET_DATABASE_PASSWORD }}

    steps:
      # Fail fast with a clear message if the machine or secrets are not set up, instead of a cryptic git or MCP error later
      - name: Preflight - secrets and tools
        shell: pwsh
        run: |
          $problems = @()
          foreach ($name in 'GH_TOKEN', 'COPILOT_GITHUB_TOKEN', 'DB_USER', 'DB_PASSWORD') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              $problems += "Secret for $name is empty. Check the secret exists as a repository secret (or in the 'build' environment) and the PAT has not expired."
            }
          }
          foreach ($tool in 'git', 'gh', 'copilot', 'flyway') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $problems += "'$tool' is not on PATH for the account the runner service runs as ($env:USERDOMAIN\$env:USERNAME)."
            }
          }
          Write-Host "Runner is running as: $env:USERDOMAIN\$env:USERNAME"
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "Preflight OK"

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.COPILOT_FIX_GH_TOKEN }} # So the script's 'git push' uses the PAT

      # The Flyway MCP reads database logins from flyway.user.toml. That file is gitignored, so a fresh checkout
      # does not have it. Write it from the secrets for this run only (it is deleted again at the end of the job).
      - name: Write database logins for the Flyway MCP
        shell: pwsh
        run: |
          # Escape backslash and double quote so any password is valid inside a TOML string
          $u = $env:DB_USER     -replace '\\', '\\' -replace '"', '\"'
          $p = $env:DB_PASSWORD -replace '\\', '\\' -replace '"', '\"'
          @"
          [environments.shadow]
          user = "$u"
          password = "$p"

          [environments.development]
          user = "$u"
          password = "$p"
          "@ | Set-Content -Path flyway.user.toml -Encoding UTF8
          Write-Host "flyway.user.toml written (shadow and development logins)"

      # Make the work visible on the issue itself
      - name: Tell the issue Copilot has started
        shell: pwsh
        run: |
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment $env:ISSUE_NUMBER --body "Copilot agent has picked this up. Watch it work: $runUrl"

      # The script does the real work - see its header for the guardrails it applies
      - name: Run Copilot fix
        id: fix
        shell: pwsh # PowerShell 7: Windows PowerShell 5.1 turns harmless git stderr output into terminating errors
        run: ./scripts/Invoke-CopilotFix.ps1 -IssueNumber $env:ISSUE_NUMBER -BaseBranch $env:BASE_BRANCH

      - name: Tell the issue where the pull request is
        if: ${{ success() }}
        shell: pwsh
        run: |
          # Multi-line block on purpose: an unquoted single-line value containing ': ' is invalid YAML
          gh issue comment $env:ISSUE_NUMBER --body "Copilot has opened a pull request for review. ${{ steps.fix.outputs.pr_url }}"

      - name: Tell the issue the run failed
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment $env:ISSUE_NUMBER --body "The Copilot run did not complete. Logs: $runUrl"

      # Never leave database logins on disk after the job
      - name: Remove database logins
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item flyway.user.toml -Force -ErrorAction SilentlyContinue

      # Keep the full Copilot transcript with the run for debugging and for the demo
      - name: Collect Copilot transcript
        if: ${{ always() }}
        shell: pwsh
        run: |
          $src = Join-Path $env:TEMP "copilot-fix-issue-$env:ISSUE_NUMBER"
          if (Test-Path $src) { Copy-Item $src -Destination copilot-logs -Recurse }

      - name: Upload Copilot transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-transcript
          path: copilot-logs/**
          if-no-files-found: ignore
