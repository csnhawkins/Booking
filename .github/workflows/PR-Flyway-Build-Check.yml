# ===========================
# Workflow: PR-Flyway-Build-Check.yml
# Description: Runs on every pull request that changes the database, BEFORE a human is asked to approve.
#   Job 1 (build-check)  - cut-down BUILD stage of GitHub-Flyway-CICD-Pipeline.yml: proves the full migration
#                          history, including the new script, deploys cleanly to an empty database.
#   Job 2 (flyway-checks) - the same Flyway Checks the pipeline runs before deploying to Test (code review and the
#                          deployment changes report, plus dry run). Nothing here involves AI, so the result
#                          is independent evidence. The HTML report is uploaded as a workflow artifact.
# ===========================

name: PR Flyway Build Check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths: # Only database changes need this check
      - 'migrations/**'
      - 'schema-model/**'
      - 'flyway.toml'

permissions:
  contents: read

jobs:
  build-check:
    name: Migrate empty Build database
    runs-on: [ self-hosted, local ]
    environment: 'build' # Same GitHub environment as the pipeline, so the same secrets apply
    concurrency: # Shares a group with the main pipeline's Build job - both reprovision the same Build database
      group: booking-build-db
      cancel-in-progress: false
    env:
      TARGET_DATABASE_ENVIRONMENT: 'Build' # Environment name in flyway.toml
      TARGET_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      TARGET_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      FIRST_UNDO_SCRIPT: "002" # Same value as the main pipeline
      RUN_UNDO: 'false' # Set to 'true' to also undo everything after migrating (mirrors the commented-out step in the main pipeline)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Migrate every script from scratch. This is the quickest way to find a script that cannot deploy.
      - name: Migrate Build DB
        uses: red-gate/flyway-actions/migrations/deploy@v2
        with:
          target-environment: ${{ env.TARGET_DATABASE_ENVIRONMENT }}
          target-user: ${{ env.TARGET_DATABASE_USERNAME }}
          target-password: ${{ env.TARGET_DATABASE_PASSWORD }}
          provision-mode: "reprovision" # Drops and recreates the Build database. Throwaway environment only.
          skip-drift-check: true
          extra-args: "${{ secrets.CUSTOM_PARAMS }}"

      # Optional: prove the undo scripts run, so a real rollback is not the first time they are executed
      - name: Undo Build DB
        if: ${{ env.RUN_UNDO == 'true' }}
        uses: red-gate/flyway-actions/migrations/undo@v2
        with:
          target-migration-version: ${{ env.FIRST_UNDO_SCRIPT }}
          target-environment: ${{ env.TARGET_DATABASE_ENVIRONMENT }}
          target-user: ${{ env.TARGET_DATABASE_USERNAME }}
          target-password: ${{ env.TARGET_DATABASE_PASSWORD }}
          skip-drift-check: true
          extra-args: "${{ secrets.CUSTOM_PARAMS }}"

  flyway-checks:
    name: Flyway Checks report
    needs: build-check
    runs-on: [ self-hosted, local ]
    environment: 'test' # Checks read the Test database to work out what a deployment to it would change
    concurrency: # The Check database is reprovisioned by the report, and is also used by the main pipeline's Test and Prod jobs
      group: booking-check-db
      cancel-in-progress: false
    env:
      TARGET_DATABASE_ENVIRONMENT: "Test" # What would change if this PR were deployed to Test
      TARGET_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      TARGET_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      REPORT_ENVIRONMENT: "Check" # Throwaway database used to build the changes report
      REPORT_DATABASE_USERNAME: "${{ secrets.TARGET_DATABASE_USERNAME }}"
      REPORT_DATABASE_PASSWORD: "${{ secrets.TARGET_DATABASE_PASSWORD }}"
      REPORT_NAME: "flyway-checks-pr-${{ github.event.pull_request.number }}.html"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Code review (fails the job on violations), deployment changes report and dry run.
      # Drift is skipped: a PR should not fail because of something unrelated that changed in the Test database.
      - name: Create Check Reports
        uses: red-gate/flyway-actions/migrations/checks@v2
        with:
          target-environment: ${{ env.TARGET_DATABASE_ENVIRONMENT }}
          target-user: ${{ env.TARGET_DATABASE_USERNAME }}
          target-password: ${{ env.TARGET_DATABASE_PASSWORD }}
          build-environment: ${{ env.REPORT_ENVIRONMENT }}
          build-user: ${{ env.REPORT_DATABASE_USERNAME }}
          build-password: ${{ env.REPORT_DATABASE_PASSWORD }}
          build-ok-to-erase: true
          skip-drift-check: true
          skip-code-scanning-upload: true
          pre-deployment-report-name: ${{ env.REPORT_NAME }}
          extra-args: "${{ secrets.CUSTOM_PARAMS }}"

      # Point the reviewer at the report from the run summary
      - name: Add report link to run summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          "### Flyway Checks" | Add-Content $env:GITHUB_STEP_SUMMARY
          "The Flyway Checks report for this pull request is attached to this run as the artifact **$env:REPORT_NAME**." | Add-Content $env:GITHUB_STEP_SUMMARY
